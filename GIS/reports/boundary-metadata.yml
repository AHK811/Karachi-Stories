area_measurement_method:
  formula: Chamberlain and Duquette geodesic polygon integral
  sphere: WGS 84 authalic radius 6371007.180991944 m
  ring_orientation_rule: clockwise ring treated as exterior, counter-clockwise as hole (ESRI Shapefile convention)
  multipolygon_rule: exterior ring areas summed, hole areas subtracted
  calibration_against_published_cod_ab_area_sqkm:
    mean_absolute_error_percent: 0.210
    max_absolute_error_percent: 0.212
    verdict: method reproduces the source's own areas to about 0.2 percent
  status: >
    interim. Not a substitute for a proper projection pipeline. Authoritative metre-based
    areas require pyproj/GDAL in EPSG:32642, which is still outstanding.

