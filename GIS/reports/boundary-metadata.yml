gdal_clip_benchmark:
  script: Tools/osm_importer/benchmark_gdal_clip.py
  results_file: GIS/validation/gdal_clip_benchmark.json
  clip_box_lonlat: [66.20, 24.30, 67.70, 25.80]
  clip_box_verified: ring area exactly 2.25 deg2, centroid 66.95 E 25.05 N
  runs:
    - {label: admin2 clipSrc to ext4, seconds: 0.178, features: 11, source_features: 160, area_deg2: 1.3533, out_kb: 97}
    - {label: admin2 spatFilter to ext4, seconds: 0.140, features: 11, source_features: 160, area_deg2: 8.3838, out_kb: 235}
    - {label: admin2 clipSrc to D 9p, seconds: 0.220, features: 11, source_features: 160, area_deg2: 1.3533, out_kb: 97}
    - {label: admin3 clipSrc to ext4, seconds: 0.452, features: 33, source_features: 577, area_deg2: 1.3533, out_kb: 199}
  findings:
    - spatFilter and clipSrc return identical feature counts but 8.3838 against 1.3533 deg2, so a
      row-count check cannot detect an uncut import
    - the 9p penalty is workload dependent, 1.24x for this CPU-bound clip against 2.8x for bulk
      file extraction, so the two figures must not be quoted interchangeably
    - areas in this section are deliberately in deg2 and are not square kilometres
  api_traps_recorded:
