risks:
  - >
    An OSM division polygon 65.63 percent larger than the administrative reference would
    clip a game world containing roughly 2,300 square kilometres of area that is not
    Karachi, dominated by the Keamari sea boundary.
  - >
    Neither candidate reproduces the 3,527 square kilometre reference, so the reference
    cannot be used as a pass criterion until the maritime question is resolved.
  - >
    COD-AB is legally permissive but administratively stale. It has no Keamari district
    and it predates the 2023 renaming.
  - >
    No Pakistani government body investigated publishes downloadable boundary polygons.
